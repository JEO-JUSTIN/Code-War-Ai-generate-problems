services:
  - type: web
    name: codewar-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codewar-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "true"
    databases:
      - name: codewar-db
        databaseName: codewar
        user: codewar_user

  - type: static
    name: codewar-frontend
    staticPublishPath: ./dist
    buildCommand: |
      cd frontend && \
      npm install && \
      npm run build
    routes:
      - path: /api
        destination: codewar-backend:8000
      - path: /ws
        destination: codewar-backend:8000

databases:
  - name: codewar-db
    databaseName: codewar
    user: codewar_user
    plan: free

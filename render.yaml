services:
  - type: web
    name: codewar-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt && \
      cd frontend && \
      npm install && \
      npm run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codewar-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: VITE_API_URL
        value: https://$RENDER_EXTERNAL_HOSTNAME

databases:
  - name: codewar-db
    databaseName: codewar
    user: codewar_user
    plan: free
